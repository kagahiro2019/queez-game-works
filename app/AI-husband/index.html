<head><link rel="stylesheet" href="style.css">
<!DOCTYPE html>
<html lang="ja">
      <meta charset="UTF-8">


  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AI-husband | YATO</title>



</head>

<body>

  <main class="chat-app">

    <!-- ヘッダー -->
    <header class="chat-header">
      <h1>AI_Yato</h1>
    </header>

    <!-- 会話エリア -->
    <section class="chat-messages">

      <!-- 夜斗 -->
      <div class="message-row yato">
        <img
          src="Asset/AI_manager_100_010_010.png"
          alt="夜斗"
          class="yato-icon"
        >

        <div class="message-bubble">お、来たな。</div>
      </div>

      <!-- ユーザー -->
      <div class="message-row user">
        <div class="message-bubble">今日も仕事手伝ってください😫</div>
      </div>

      <!-- 夜斗 -->
      <div class="message-row yato">
        <img
          src="Asset/AI_manager_100_010_010.png"
          alt="夜斗"
          class="yato-icon"
        >

        <div class="message-bubble">で、今日は何からやる？</div>
      </div>

    </section>

    <!-- 入力エリア -->
    <footer class="chat-input">

      <button type="button">＋</button>
      <button type="button">📷</button>
      <button type="button">🖼️</button>

      <textarea
  placeholder="メッセージを入力"
  rows="1"
></textarea>

      <button type="button">送信</button>

    </footer>

  </main>
<script src="script.js"></script>
</body>
</html>
